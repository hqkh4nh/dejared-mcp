name: Release & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify manifest versions
        run: npm run check-versions

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build JAR
        working-directory: java-mcp
        run: ./gradlew build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: java-mcp/build/libs/dejared-mcp-*.jar

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Trusted publishing needs Node 22.14+ and the npm 11.5.1+ that ships with it.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Prepare npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version
          # setup-node's registry-url writes an _authToken line. With no token set it
          # expands to empty, and npm reads that as "already authenticated" and skips
          # the OIDC exchange entirely. Removing it lets trusted publishing engage.
          sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"

      # Authenticates over OIDC via the id-token permission above, so no npm token
      # is involved. Also attaches a provenance attestation automatically.
      - name: Publish to npm
        run: npm publish --access public

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        shell: bash
        run: |
          # npm metadata may take a moment to propagate after a successful publish.
          for attempt in {1..5}; do
            if ./mcp-publisher publish; then
              exit 0
            fi
            sleep 15
          done
          exit 1
