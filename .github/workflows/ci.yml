name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master

jobs:
  check-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reject typographic dashes
        run: python3 .github/scripts/check-dashes.py

      - name: Verify every manifest carries the same version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          FAILED=0
          check() {
            ACTUAL=$(node -p "$2" 2>/dev/null || echo "<unreadable>")
            if [ "$ACTUAL" != "$PKG_VERSION" ]; then
              echo "::error::$1 is at $ACTUAL, package.json is at $PKG_VERSION"
              FAILED=1
            fi
          }
          check "server.json"                       "require('./server.json').version"
          check "server.json packages[0]"           "require('./server.json').packages[0].version"
          check ".claude-plugin/plugin.json"        "require('./.claude-plugin/plugin.json').version"
          check ".claude-plugin/marketplace.json"   "require('./.claude-plugin/marketplace.json').plugins[0].version"
          check ".codex-plugin/plugin.json"         "require('./.codex-plugin/plugin.json').version"
          check ".agents/plugins/marketplace.json"  "require('./.agents/plugins/marketplace.json').plugins[0].version"
          [ "$FAILED" -eq 0 ] || exit 1
          echo "Versions match: $PKG_VERSION"

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Run tests
        working-directory: java-mcp
        run: ./gradlew test
