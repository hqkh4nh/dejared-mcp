name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  check-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reject typographic dashes
        run: python3 .github/scripts/check-dashes.py

      - name: Verify every manifest carries the same version
        run: npm run check-versions

      - name: Test version synchronization
        run: node --test scripts/sync-version.test.cjs

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Run tests
        working-directory: java-mcp
        run: ./gradlew test
